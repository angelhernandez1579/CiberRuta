<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CiberRuta</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#1e293b;position:sticky;top:0;z-index:9}
.logo{font-weight:900;font-size:1.3rem;color:#4ade80;cursor:pointer}
.stats{display:flex;gap:12px;align-items:center;font-weight:700}
#mute{background:none;border:0;font-size:1.2rem;cursor:pointer}
main{max-width:480px;margin:auto;padding:18px 18px 220px}
.unit{background:#1e293b;border-radius:18px;padding:16px;margin-bottom:22px;border-bottom:5px solid #334155}
.unit h2{font-size:1.1rem;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;margin:12px 0}
.row span{font-weight:600}
.node{flex:none;width:68px;height:68px;border-radius:50%;border:0;font-size:1.5rem;color:#fff;cursor:pointer;background:#22c55e;box-shadow:0 6px 0 #15803d;transition:transform .15s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #15803d}
.node.done{background:#facc15;box-shadow:0 6px 0 #a16207}
.node.lock{background:#475569;box-shadow:0 6px 0 #334155;cursor:not-allowed}
.node.cur{animation:pulse 1.4s infinite}
.card{background:#1e293b;border-radius:20px;padding:24px;margin:10px 0;border-bottom:5px solid #334155}
.center{text-align:center}
.tag{color:#38bdf8;font-weight:800;font-size:.8rem;letter-spacing:1px}
.txt{font-size:1.05rem;line-height:1.6;margin:14px 0 22px}
.q{font-size:1.25rem;line-height:1.4;margin-bottom:18px}
.big{font-size:4rem}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:#22c55e;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 #15803d;margin-top:14px}
.btn:active{transform:translateY(3px);box-shadow:none}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border-radius:14px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1rem;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#38bdf8}
.good{background:#14532d!important;border-color:#22c55e!important}
.bad{background:#7f1d1d!important;border-color:#ef4444!important}
.top{display:flex;align-items:center;gap:12px;margin:6px 0}
.x{background:none;border:0;color:#94a3b8;font-size:1.3rem;cursor:pointer}
.bar{flex:1;height:14px;background:#334155;border-radius:8px;overflow:hidden}
.bar div{height:100%;background:#4ade80;transition:width .4s}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 18px 26px;max-width:480px;margin:auto;border-radius:18px 18px 0 0;animation:up .3s}
.okb{background:#14532d}
.badb{background:#7f1d1d}
.pop{animation:pop .4s}
.slide{animation:slide .35s}
.shake{animation:shake .4s}
.conf{position:fixed;top:-30px;font-size:1.5rem;animation:fall 2.5s linear forwards;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<header>
  <span class="logo" onclick="home()">🛡️ CiberRuta</span>
  <div class="stats"><span>⚡ <b id="xp">0</b></span><span>🔥 <b id="sk">0</b></span><button id="mute" onclick="tgl()" title="Sonido">🔊</button></div>
</header>
<main id="app"></main>

<script>
const U=[
{n:"🔐 Contraseñas",c:"#22c55e",L:[
{t:"Contraseñas fuertes",th:"Una buena contraseña es larga (12 caracteres o más), combina letras, números y símbolos, y no es una palabra del diccionario. Una frase aleatoria de varias palabras puede ser muy segura y fácil de recordar.",q:[
["¿Cuál es la contraseña más segura?",["123456","Password2024","Tr3n-Azul-Lun4-Vuela!"],2,"Es larga, aleatoria y mezcla tipos de caracteres."],
["¿Qué longitud mínima se recomienda hoy?",["6 caracteres","8 caracteres","12 caracteres o más"],2,"Las contraseñas largas resisten mucho mejor los ataques de fuerza bruta."]]},
{t:"Gestores y 2FA",th:"Un gestor de contraseñas genera y guarda una clave única para cada sitio, y solo tienes que recordar una maestra. Además, activa la autenticación en dos pasos (2FA) para añadir una segunda barrera.",q:[
["¿Debes reutilizar la misma contraseña en varios sitios?",["Sí, es más fácil","No, cada cuenta necesita una propia"],1,"Si una se filtra, los atacantes probarán esa clave en todas tus cuentas."],
["¿Qué añade la autenticación en dos pasos?",["Una segunda barrera además de la contraseña","Acelera el inicio de sesión sin seguridad"],0,"Aunque roben tu contraseña, no podrán entrar sin el segundo factor."]]}]},

{n:"🎣 Phishing",c:"#f97316",L:[
{t:"¿Qué es el phishing?",th:"El phishing es un engaño por correo, SMS o llamada para robarte datos. Suele crear urgencia, como decir que tu cuenta será bloqueada, y usa enlaces falsos que imitan marcas conocidas.",q:[
["Recibes un correo urgente del banco pidiéndote verificar tu cuenta con un enlace. ¿Qué haces?",["Hago clic rápido para evitar el bloqueo","Entro escribiendo la dirección del banco yo mismo"],1,"Ir directo al sitio oficial evita caer en enlaces falsos."],
["¿Cuál es una señal típica de phishing?",["Urgencia o amenazas","Un saludo con tu nombre completo"],0,"Presionar para actuar rápido es una táctica clásica del engaño."]]},
{t:"Revisa antes de hacer clic",th:"Pasa el cursor sobre un enlace para ver la dirección real antes de abrirlo. Desconfía de dominios raros, errores ortográficos y remitentes que no esperabas.",q:[
["¿Qué dominio parece legítimo?",["paypal.com","paypa1-soporte.info"],0,"Los atacantes usan caracteres parecidos, como el 1 en lugar de la l."],
["Si dudas de un mensaje, lo mejor es...",["Contactar a la empresa por su canal oficial","Responder con tus datos para aclarar"],0,"Nunca compartas datos por el mismo canal donde llegó la duda."]]}]},

{n:"📶 Redes",c:"#38bdf8",L:[
{t:"Wi-Fi público",th:"Las redes Wi-Fi públicas pueden ser espiadas por cualquiera conectado a ellas. Evita entrar a cuentas importantes sin una VPN y confirma el nombre exacto de la red antes de conectarte.",q:[
["¿Qué puedes usar para cifrar tu tráfico en un Wi-Fi público?",["Una VPN","El modo avión"],0,"La VPN crea un túnel cifrado entre tu dispositivo y el servicio."],
["Una red llamada 'Free_WiFi_Cafe' sin contraseña es...",["Siempre segura","Riesgosa para datos sensibles"],1,"Puede ser una red falsa creada para capturar tu información."]]},
{t:"Router seguro",th:"Cambia la contraseña por defecto de tu router, usa cifrado WPA3 o WPA2 y mantén el firmware actualizado. Así reduces el riesgo de que alguien entre a tu red doméstica.",q:[
["¿Qué cifrado es preferible en tu Wi-Fi?",["WEP","WPA3"],1,"WEP está obsoleto y es fácil de romper."],
["¿Por qué cambiar la clave por defecto del router?",["Porque suele ser predecible y conocida por atacantes","Porque es más lenta"],0,"Muchos fabricantes usan claves predecibles que están documentadas."]]}]},

{n:"🦠 Malware",c:"#ef4444",L:[
{t:"Tipos de malware",th:"El malware es software malicioso. Incluye virus, gusanos y troyanos, además de ransomware, que cifra tus archivos y pide un rescate, y spyware, que espía tu actividad sin que lo notes.",q:[
["¿Qué malware cifra tus archivos y pide dinero?",["Ransomware","Spyware"],0,"El ransomware bloquea tus archivos hasta que pagas, y pagar no garantiza recuperarlos."],
["¿Un programa pirata gratuito puede contener malware?",["Sí, es un riesgo común","No, nunca"],0,"Los instaladores falsos son una vía muy usada para distribuir malware."]]},
{t:"Actualizaciones y copias",th:"Mantener el sistema y las apps actualizadas cierra vulnerabilidades conocidas. Las copias de seguridad periódicas son tu mejor defensa contra el ransomware, porque te permiten restaurar tus archivos.",q:[
["¿Qué protege mejor contra el ransomware además del antivirus?",["Copias de seguridad","Desactivar las actualizaciones"],0,"Si tienes copias, puedes restaurar tus datos sin pagar."],
["¿Por qué conviene actualizar el sistema?",["Para corregir fallos de seguridad","Para ocupar más espacio"],0,"Las actualizaciones suelen incluir parches de seguridad."]]}]},

{n:"🕵️ Privacidad",c:"#a855f7",L:[
{t:"Tu huella digital",th:"Cada publicación, foto o ubicación que compartes construye tu huella digital. Los atacantes pueden usarla para adivinar contraseñas, responder preguntas de seguridad o suplantar tu identidad.",q:[
["¿Qué información es riesgosa publicar?",["Tu dirección o tu rutina diaria","Una foto de un paisaje"],0,"Revelar rutinas y ubicaciones facilita el acoso y el robo."],
["Antes de publicar, conviene revisar...",["La configuración de privacidad","Solo el número de likes"],0,"Ajusta quién puede ver tus publicaciones y tus datos."]]},
{t:"Permisos de las apps",th:"Muchas apps piden acceso a contactos, micrófono o ubicación sin necesitarlo. Concede solo los permisos que realmente requiere su función y revísalos de vez en cuando.",q:[
["Una app de linterna pide acceso a tus contactos. ¿Qué haces?",["Niego el permiso","Lo acepto sin pensar"],0,"Una linterna no necesita tus contactos, así que es una señal de alerta."],
["¿Cuándo conviene revisar los permisos de tus apps?",["Periódicamente","Nunca"],0,"Las apps pueden pedir permisos nuevos con sus actualizaciones."]]}]},

{n:"🧠 Ingeniería social",c:"#eab308",L:[
{t:"Manipulación humana",th:"La ingeniería social manipula emociones como el miedo, la confianza o la curiosidad para obtener información. Alguien que dice ser soporte técnico y te pide tu clave es una señal de alarma.",q:[
["Alguien llama diciendo ser soporte técnico y pide tu clave. ¿Qué haces?",["Cuelgo y verifico por canales oficiales","Se la doy para ayudarlo"],0,"Ninguna empresa legítima te pedirá tu contraseña por teléfono."],
["¿Qué emociones suelen explotar estos engaños?",["Urgencia y miedo","Aburrimiento"],0,"La presión emocional impide pensar con claridad."]]},
{t:"Navegación segura",th:"HTTPS cifra la comunicación entre tu navegador y el sitio, pero no garantiza que el sitio sea confiable. Revisa el dominio exacto antes de ingresar datos y no ejecutes descargas inesperadas.",q:[
["El candado en la barra de direcciones indica...",["Que la conexión está cifrada","Que el sitio es honesto"],0,"El candado solo confirma el cifrado, no la intención del sitio."],
["Ante una descarga inesperada, lo correcto es...",["Desconfiar y no ejecutarla","Ejecutarla rápido para ver qué es"],0,"Los archivos inesperados son una vía común de infección."]]}]}
];

const $=id=>document.getElementById(id);
const app=$('app');
let S=JSON.parse(localStorage.getItem('ciberruta')||'{"xp":0,"done":[],"streak":0,"day":""}');
const save=()=>localStorage.setItem('ciberruta',JSON.stringify(S));
const ALL=[];
U.forEach((u,ui)=>u.L.forEach((l,li)=>ALL.push({id:ui+'.'+li,ui,li})));
let cur,qi,hearts,correct,muted=false,ctx;

function beep(f,d,type,when=0){
  if(muted)return;
  ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+when;
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.start(t);o.stop(t+d);
}
const SFX={
  click:()=>beep(520,.06,'triangle'),
  ok:()=>{beep(660,.12,'sine');beep(990,.18,'sine',.1)},
  bad:()=>beep(180,.3,'sawtooth'),
  win:()=>[523,659,784,1046].forEach((f,i)=>beep(f,.3,'triangle',i*.13))
};
function tgl(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊'}

function stats(){$('xp').textContent=S.xp;$('sk').textContent=S.streak}

function home(){
  stats();
  let h='<h1 class="center" style="margin:10px 0 6px">Tu ruta de ciberseguridad</h1><p class="center" style="color:#94a3b8;margin-bottom:16px">Aprende, practica y protege tu vida digital</p>';
  U.forEach((u,ui)=>{
    h+=`<section class="unit" style="border-color:${u.c}"><h2 style="color:${u.c}">${u.n}</h2>`;
    u.L.forEach((l,li)=>{
      const i=ALL.findIndex(x=>x.ui===ui&&x.li===li), id=ui+'.'+li;
      const done=S.done.includes(id), open=i===0||S.done.includes(ALL[i-1].id);
      const cls=done?'done':open?'cur':'lock';
      h+=`<div class="row" style="margin-left:${li%2?'36px':'0'}"><button class="node ${cls}" ${open?'':'disabled'} onclick="lesson(${ui},${li})">${done?'✔':open?'★':'🔒'}</button><span>${l.t}</span></div>`;
    });
    h+='</section>';
  });
  app.innerHTML=h;
}

function lesson(ui,li){
  cur=U[ui].L[li];cur.id=ui+'.'+li;SFX.click();
  app.innerHTML=`<div class="card pop"><p class="tag">TEORÍA · ${U[ui].n}</p><h2 class="q">${cur.t}</h2><p class="txt">${cur.th}</p><button class="btn" onclick="startQ()">Empezar ▶</button></div>`;
  window.scrollTo(0,0);
}

function startQ(){qi=0;hearts=3;correct=0;ask()}

function ask(){
  const q=cur.q[qi];
  app.innerHTML=`<div class="top"><button class="x" onclick="home()">✕</button><div class="bar"><div style="width:${qi/cur.q.length*100}%"></div></div><span>❤️ ${hearts}</span></div>
  <div class="card slide"><h2 class="q">${q[0]}</h2>${q[1].map((o,i)=>`<button class="opt" onclick="answer(${i})">${o}</button>`).join('')}</div><div id="fb"></div>`;
}

function answer(i){
  const q=cur.q[qi],ok=i===q[2];
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q[2])b.classList.add('good');
    else if(j===i)b.classList.add('bad');
  });
  if(ok){correct++;SFX.ok()}
  else{hearts--;SFX.bad();document.querySelector('.card').classList.add('shake')}
  $('fb').innerHTML=`<div class="fb ${ok?'okb':'badb'}"><b>${ok?'¡Correcto! ✅':'Incorrecto ❌'}</b><p style="margin:6px 0 4px">${q[3]}</p><button class="btn" onclick="next()">Continuar</button></div>`;
}

function next(){
  if(hearts<=0)return lost();
  qi++;
  qi<cur.q.length?ask():finish();
}

function lost(){
  app.innerHTML=`<div class="card pop center"><div class="big">💔</div><h2 class="q">Te quedaste sin corazones</h2><p class="txt">No pasa nada: repasa la teoría e inténtalo de nuevo.</p><button class="btn" onclick="startQ()">Reintentar</button><button class="btn" style="background:#475569;box-shadow:0 5px 0 #334155" onclick="home()">Volver al mapa</button></div>`;
  SFX.bad();
}

function finish(){
  const first=!S.done.includes(cur.id);
  const gain=first?10*correct+5:0;
  if(first)S.done.push(cur.id);
  S.xp+=gain;
  const today=new Date().toDateString(),yest=new Date(Date.now()-864e5).toDateString();
  if(S.day!==today){S.streak=S.day===yest?S.streak+1:1;S.day=today}
  save();stats();SFX.win();burst();
  app.innerHTML=`<div class="card pop center"><div class="big">🏆</div><h2 class="q">¡Lección completada!</h2><p class="txt">Respuestas correctas: ${correct}/${cur.q.length}<br>+${gain} XP</p><button class="btn" onclick="home()">Continuar en el mapa</button></div>`;
}

function burst(){
  for(let i=0;i<30;i++){
    const c=document.createElement('span');
    c.className='conf';
    c.textContent=['🎉','⭐','🛡️','✨'][i%4];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

home();
</script>
</body>
</html>
