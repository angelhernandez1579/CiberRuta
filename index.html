<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CiberRuta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>CiberRuta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CiberRuta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#1e293b;position:sticky;top:0;z-index:9;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.2rem;color:#4ade80;cursor:pointer}
.stats{display:flex;gap:10px;align-items:center;font-weight:700;font-size:.9rem}
#mute{background:none;border:0;font-size:1.1rem;cursor:pointer}
main{max-width:480px;margin:auto;padding:18px 18px 200px}
.hero{text-align:center;padding:24px 0 10px}
.hero h1{font-size:2.2rem;margin:10px 0 4px}
.sub{color:#94a3b8;line-height:1.5;margin-bottom:18px}
.rv{opacity:0;transform:translateY(30px);transition:.7s;margin:34px 0}
.rv.in{opacity:1;transform:none}
.rv h2{font-size:1.4rem;margin-bottom:10px;color:#38bdf8}
.rv p{line-height:1.7;color:#cbd5e1}
.feat{display:flex;gap:12px;background:#1e293b;border-radius:16px;padding:14px;margin:10px 0;border-left:5px solid #22c55e}
.feat b{display:block;margin-bottom:4px}
.feat div{font-size:.92rem;color:#cbd5e1;line-height:1.5}
.feat .ic{font-size:1.8rem}
.ods{background:#1e293b;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.92rem;line-height:1.5}
.ods b{color:#facc15}
.ft{margin-top:50px;padding-top:20px;border-top:1px solid #334155;font-size:.9rem}
.fcols{display:flex;justify-content:space-between;gap:16px;margin-top:14px;flex-wrap:wrap}
.fcols div{display:flex;flex-direction:column;gap:8px}
.fcols a{color:#94a3b8;text-decoration:none}
.unit{background:#1e293b;border-radius:18px;padding:16px;margin-bottom:22px;border-bottom:5px solid #334155}
.unit h2{font-size:1.1rem;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;margin:12px 0}
.row span{font-weight:600}
.node{flex:none;width:68px;height:68px;border-radius:50%;border:0;font-size:1.5rem;color:#fff;cursor:pointer;background:#22c55e;box-shadow:0 6px 0 #15803d;transition:transform .15s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #15803d}
.node.done{background:#facc15;box-shadow:0 6px 0 #a16207}
.node.lock{background:#475569;box-shadow:0 6px 0 #334155;cursor:not-allowed}
.node.cur{animation:pulse 1.4s infinite}
.card{background:#1e293b;border-radius:20px;padding:24px;margin:10px 0;border-bottom:5px solid #334155}
.center{text-align:center}
.tag{color:#38bdf8;font-weight:800;font-size:.8rem;letter-spacing:1px;margin-top:4px}
.txt{font-size:1.02rem;line-height:1.65;margin:12px 0 18px}
.q{font-size:1.25rem;line-height:1.4;margin-bottom:14px}
.big{font-size:4rem}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:#22c55e;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 #15803d;margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:#475569;box-shadow:0 5px 0 #334155}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#334155}
.dots i.on{background:#4ade80;transform:scale(1.3)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border-radius:14px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1rem;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#38bdf8}
.good{background:#14532d!important;border-color:#22c55e!important}
.bad{background:#7f1d1d!important;border-color:#ef4444!important}
.top{display:flex;align-items:center;gap:12px;margin:6px 0}
.x{background:none;border:0;color:#94a3b8;font-size:1.3rem;cursor:pointer}
.bar{flex:1;height:14px;background:#334155;border-radius:8px;overflow:hidden}
.bar div{height:100%;background:#4ade80;transition:width .6s}
.fb{position:fixed;left:0;right:0;bottom:0;padding:18px 18px 26px;max-width:480px;margin:auto;border-radius:18px 18px 0 0;animation:up .3s}
.okb{background:#14532d}
.badb{background:#7f1d1d}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:1rem;margin:10px 0}
.tips{margin:12px 0 0 18px;line-height:1.7}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:1rem}
.rng{width:100%;margin:10px 0}
.out{font-family:monospace;font-size:1.15rem;background:#0f172a;padding:16px;border-radius:12px;word-break:break-all;margin:12px 0;min-height:56px}
.mail{background:#0f172a;padding:14px;border-radius:12px;font-size:.95rem;line-height:1.5;margin:12px 0}
.mail p{margin:6px 0}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.bd{background:#0f172a;border-radius:12px;padding:10px 4px;text-align:center;font-size:1.8rem;opacity:.3}
.bd.on{opacity:1;border:2px solid #facc15;animation:pop .5s}
.bd span{display:block;font-size:.68rem;margin-top:4px}
.rk{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:#0f172a;margin:8px 0;font-weight:600}
.rk span{flex:1}
.rk.me{border:2px solid #4ade80}
.lvlc{display:flex;gap:14px;align-items:center}
.bob{animation:bob 2.4s ease-in-out infinite}
.wave{animation:wave 1.6s ease-in-out infinite;transform-origin:center}
.float{animation:float 4s ease-in-out infinite}
.tip{background:#0f172a;border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.5;position:relative}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#facc15;color:#0f172a;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;animation:pop .4s;white-space:nowrap;font-size:.9rem;box-shadow:0 6px 0 #a16207}
.pop{animation:pop .4s}
.slide{animation:slide .35s}
.shake{animation:shake .4s}
.conf{position:fixed;top:-30px;font-size:1.5rem;animation:fall 2.5s linear forwards;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tools button{background:#1e293b;border:0;border-radius:14px;padding:12px 4px;color:#e2e8f0;font-size:1.4rem;cursor:pointer;border-bottom:4px solid #334155}
.tools span{display:block;font-size:.62rem;margin-top:4px}
.gcard{display:flex;gap:12px;align-items:center;background:#0f172a;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;transition:transform .2s}
.gcard:hover{transform:translateX(6px)}
.gcard .ic,.em .ic{font-size:1.8rem}
.gcard div{flex:1}
.gcard .bar{margin-top:6px}
.sub2{margin-top:10px;color:#facc15}
.mstats{display:flex;justify-content:space-between;font-weight:700;margin:10px 0}
#map{width:100%;border-radius:14px;border:1px solid #334155}
.nw{background:#0f172a;border-radius:14px;padding:14px;margin:10px 0;border-left:4px solid #38bdf8;animation:slide .5s both}
.nw small a{color:#38bdf8}
.em{display:flex;gap:12px;background:#0f172a;border-radius:14px;padding:14px;margin:10px 0;animation:pop .5s both}
.em p{font-size:.88rem;color:#cbd5e1;margin:4px 0}
.em a{display:inline-block;margin-top:4px;background:#dc2626;color:#fff;padding:6px 12px;border-radius:10px;text-decoration:none;font-weight:700}
.em small{font-weight:700;color:#facc15}
main{padding-bottom:110px}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:none;justify-content:space-around;background:#0b1324;border-top:2px solid #1e293b;padding:8px 0 14px;z-index:10}
#nav button{background:none;border:0;color:#94a3b8;font-size:.68rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 8px;border-radius:12px;transition:background .2s}
#nav button i{font-style:normal;font-size:1.5rem;transition:transform .25s}
#nav button.on{color:#38bdf8;background:#1e293b}
#nav button.on i{transform:scale(1.25)}
.banner{background:#1cb0f6;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 0 #1899d6;color:#fff;cursor:pointer;margin-bottom:24px;animation:pop .5s}
.banner small,.mod small{display:block;font-size:.72rem;letter-spacing:1px;opacity:.85}
.banner b{font-size:1.1rem}
.banner span{font-size:1.4rem}
.mod{display:flex;align-items:center;gap:12px;background:var(--c);border-radius:16px;padding:12px 16px;color:#fff;margin:26px 0 16px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:slide .5s}
.mod>div{flex:1}
.mod>span{font-weight:800}
.ring{width:46px;height:46px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,.3);stroke-width:5}
.rfg{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;transition:stroke-dasharray 1s}
.path{display:flex;flex-direction:column;align-items:center;gap:18px}
.pn{display:flex;flex-direction:column;align-items:center;transition:transform .3s}
.pn small{margin-top:6px;font-weight:700;color:#cbd5e1;font-size:.78rem;text-align:center}
.mas{display:flex;align-items:center;gap:8px;margin:4px 0}
.mas .tip{font-size:.78rem;max-width:200px}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.hgrid button{background:#0f172a;border:0;border-bottom:4px solid #334155;border-radius:16px;padding:20px 8px;color:#e2e8f0;cursor:pointer;font-weight:700;animation:pop .4s both}
.hgrid i{display:block;font-style:normal;font-size:2rem;margin-bottom:6px}
#back{display:none;background:#334155;border:0;color:#fff;padding:7px 12px;border-radius:10px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #1e293b}
#back:active{transform:translateY(2px)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;color:#1f2937;font-weight:700;font-size:1rem;margin-top:12px;cursor:pointer;box-shadow:0 4px 0 #cbd5e1}
.gbtn:active{transform:translateY(3px);box-shadow:none}
.av{border-radius:50%;object-fit:cover;border:3px solid #facc15;flex:none}
.av.ph{display:flex;align-items:center;justify-content:center;background:#334155;font-weight:900;font-size:1.6rem;color:#fff;margin:0 auto}
.rk .av{margin-right:2px}
.edit{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.edit .inp{margin:6px 0}
.mcard{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin:0 0 16px;border-left:5px solid #facc15}
.rama{background:#0f172a;border-radius:16px;padding:14px;margin:12px 0;border-left:5px solid var(--c)}
.rama.lock{opacity:.45}
.rh{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;gap:8px}
.rama .bar{margin:6px 0}
.rama small{color:#94a3b8}
.dq{margin:14px 0}
.dq p{margin-bottom:6px;font-weight:600}
.dopts{display:flex;gap:8px}
.dbtn{flex:1;padding:10px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-weight:700;cursor:pointer}
.dbtn.sel{border-color:#22c55e;background:#14532d}
.mini{background:#facc15;color:#0f172a;border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;white-space:nowrap}
.gcard small{display:block;color:#94a3b8;font-size:.8rem}
.frame-gold .av{box-shadow:0 0 0 4px #facc15,0 0 18px #facc15}
.frame-neon .av{box-shadow:0 0 0 4px #22c55e,0 0 18px #22c55e}
.fb{max-height:60vh;overflow:auto}
.mail{line-height:1.5}
.abtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:0;border-radius:14px;background:#000;color:#fff;font-weight:700;font-size:1rem;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 #333}
.abtn:active{transform:translateY(3px);box-shadow:none}
.frame-fundador .av{box-shadow:0 0 0 4px #f5c542,0 0 22px #f5c542}
#nav button{font-size:.62rem;padding:6px 4px}
#nav button i{font-size:1.3rem}
</style>
</head>
<body>
<header>
  <span class="logo" onclick="enter()" id="logo"></span>
  <button id="back" onclick="home()">← Ruta</button>
  <div class="stats"><span>⚡<b id="xp">0</b></span><span>🪙<b id="coins">0</b></span><span>🔥<b id="sk">0</b></span><button id="mute" onclick="tgl()" title="Sonido">🔊</button></div>
</header>
<main id="app"></main>
<nav id="nav">
<button class="on" onclick="go(this,home)"><i>🗺️</i>Ruta</button>
<button onclick="go(this,hub)"><i>🧰</i>Herramientas</button>
<button onclick="go(this,ranking)"><i>🏆</i>Ranking</button>
<button onclick="go(this,noticias)"><i>📰</i>Noticias</button>
<button onclick="go(this,tienda)"><i>🛒</i>Tienda</button>
<button onclick="go(this,profile)"><i>👤</i>Perfil</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="supa.js"></script>
<script src="lessons.js"></script>
<script src="extra.js"></script>
<script src="lessons2.js"></script>
<script src="app.js"></script>
<script src="news.js"></script>
<script src="modulos.js"></script>
<script src="skills.js"></script>
</body>
</html>
