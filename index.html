/* Pulido móvil (skills: mobile-native y emil-design-eng) */
body{min-height:100dvh}
input,select,textarea{font-size:16px!important}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.opt{transition:border-color .2s ease-out,background-color .2s ease-out}
.node:active,.gcard:active,.opt:active,.tools button:active,.hgrid button:active,.dbtn:active,.gbtn:active{transform:scale(.97)}
.gcard:hover{transform:none}
@media (hover:hover) and (pointer:fine){
  .gcard:hover{transform:translateX(6px)}
  .opt:hover{border-color:#38bdf8}
}
header{padding-top:calc(10px + env(safe-area-inset-top))}
#nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#back2{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.toast{transform-origin:top center}

/* ===== Pulido de interfaz (diseño y experiencia móvil) ===== */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overscroll-behavior:none;-webkit-font-smoothing:antialiased}
input,textarea,select{font-size:16px}
header{padding-top:calc(10px + env(safe-area-inset-top))}
button,.btn,.opt,.node,.gcard,.tools button,.hgrid button,.dbtn,.mini,#nav button{
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out),background-color 200ms ease,border-color 200ms ease,color 200ms ease}
button:active,.opt:active,.node:active,.gcard:active,.tools button:active,.hgrid button:active,.dbtn:active,.mini:active{transform:scale(0.97)}
.btn:active{transform:translateY(3px)}
.pop{animation:pop .3s var(--ease-out) both}
.slide{animation:slide .3s var(--ease-out) both}
.rv{transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.fb{animation:up .3s var(--ease-drawer) both}
#nav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#nav button i{transition:transform 180ms var(--ease-out)}
#back2{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media (hover:hover) and (pointer:fine){
  .opt:hover{border-color:#38bdf8}
  .gcard:hover{transform:translateX(6px)}
  #nav button:hover{color:#e2e8f0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== Segunda pasada: find-animation-opportunities + animate + apple-design + emil-design-eng ===== */
/* Quitamos movimiento donde se repite decenas de veces al día (gate de frecuencia) */
#nav button.on i{transform:none}
@media (hover:hover) and (pointer:fine){ .gcard:hover{transform:none} }
/* Notificaciones: entran desde el borde superior, misma dirección en la que se ocultan */
@keyframes toastIn{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast{animation:toastIn .35s var(--ease-drawer) both}
/* Progreso: llenado con curva de salida fuerte, sin rebote */
.bar div{transition:width .6s var(--ease-out)}
.rfg{transition:stroke-dasharray .7s var(--ease-out)}
/* Feedback de respuesta y apertura de paneles dentro de 300 ms */
.fb{animation:up .28s var(--ease-drawer) both}
.pop{animation:pop .28s var(--ease-out) both}
/* Latido del nodo actual: más sutil */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
